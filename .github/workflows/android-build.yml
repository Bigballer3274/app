name: Build / Dev / Android

run-name: Android dev build by @${{ github.actor }}

on:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  NDK_VERSION: r26d

jobs:
  prepare_release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="android-dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"
          NAME="Android Dev Build #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${SHORT_SHA})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release body (include commits since last Android build)
        id: release_body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          TAG_PREFIX="android-dev"
          PREV_TAG=""

          print_commit_range() {
            local range="$1"
            local empty_message="$2"
            local count=0

            while IFS=$'\t' read -r sha subject; do
              [[ -z "$sha" ]] && continue
              short_sha="${sha:0:7}"
              echo "- [\`${short_sha}\`](${REPO_URL}/commit/${sha}) ${subject}"
              count=$((count + 1))
            done < <(git log --pretty=format:'%H%x09%s%n' "${range}")

            if [[ "${count}" -eq 0 ]]; then
              echo "- ${empty_message}"
            fi
          }

          PREV_SUCCESS_RUN_INFO="$(
            python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          workflow_ref = os.environ["GITHUB_WORKFLOW_REF"]
          workflow = workflow_ref.split("@", 1)[0].split("/")[-1]
          branch = os.environ["GITHUB_REF_NAME"]
          current_run = int(os.environ["GITHUB_RUN_NUMBER"])
          current_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          token = os.environ.get("GH_TOKEN", "")

          params = urllib.parse.urlencode({
              "status": "completed",
              "event": "workflow_dispatch",
              "branch": branch,
              "per_page": 100,
          })

          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?{params}"

          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          if token:
              headers["Authorization"] = f"Bearer {token}"

          req = urllib.request.Request(url, headers=headers)

          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)

          best = None

          for run in data.get("workflow_runs", []):
              if run.get("conclusion") != "success":
                  continue

              run_number = int(run.get("run_number") or 0)
              run_attempt = int(run.get("run_attempt") or 1)

              if run_number < current_run or (
                  run_number == current_run and run_attempt < current_attempt
              ):
                  key = (run_number, run_attempt)

                  if best is None or key > best:
                      best = key

          if best is not None:
              print(f"{best[0]}\t{best[1]}")
          PY
          )"

          if [[ -n "${PREV_SUCCESS_RUN_INFO}" ]]; then
            IFS=$'\t' read -r PREV_RUN PREV_ATTEMPT <<< "${PREV_SUCCESS_RUN_INFO}"

            PREV_TAG="$(git tag --list "${TAG_PREFIX}-${PREV_RUN}-${PREV_ATTEMPT}-*" --sort=-creatordate | head -n 1)"

            if [[ -z "${PREV_TAG}" ]]; then
              PREV_TAG="$(git tag --list "${TAG_PREFIX}-${PREV_RUN}-*" --sort=-creatordate | head -n 1)"
            fi
          fi

          BODY_DELIM="BODY_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          {
            echo "body<<${BODY_DELIM}"
            echo "Automated Android build artifacts for commit \`${GITHUB_SHA}\`."
            echo "Workflow run: ${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
            echo

            if [[ -n "$PREV_TAG" ]]; then
              PREV_SHA="$(git rev-list -n 1 "${PREV_TAG}")"

              echo "### Changes since previous Android build \`${PREV_TAG}\`"
              echo "Compare: ${REPO_URL}/compare/${PREV_TAG}...${GITHUB_SHA}"
              echo

              if git merge-base --is-ancestor "${PREV_SHA}" "${GITHUB_SHA}"; then
                print_commit_range "${PREV_TAG}..${GITHUB_SHA}" "No new commits since the previous Android build."

              elif git merge-base --is-ancestor "${GITHUB_SHA}" "${PREV_SHA}"; then
                echo "- This build is on an older commit than the previous Android build."
                echo "- Commits in previous build but not this build:"
                print_commit_range "${GITHUB_SHA}..${PREV_TAG}" "No differing commits found."

              else
                echo "- Current and previous Android builds are on different branches."
                echo "- Commits only in this build:"
                print_commit_range "${PREV_TAG}..${GITHUB_SHA}" "No unique commits in this build."
                echo "- Commits only in previous build:"
                print_commit_range "${GITHUB_SHA}..${PREV_TAG}" "No unique commits in previous build."
              fi

            else
              echo "### Changes"
              echo "- No previous successful Android build tag found."
            fi

            echo "${BODY_DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          generate_release_notes: false
          body: ${{ steps.release_body.outputs.body }}

  android:
    needs: prepare_release
    runs-on: ubuntu-latest

    env:
      APTABASE_KEY: ${{ secrets.APTABASE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install Rust
        uses: ./.github/actions/setup-rust-build
        with:
          cache-key: android
          cache-targets: false
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Free runner disk space before Android build
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            perl

      - name: Provide Android AR/RANLIB shims for OpenSSL
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "Using NDK at $NDK"
          echo "Toolchain bin at $TOOLCHAIN"

          TRIPLES=(
            aarch64-linux-android
            armv7-linux-androideabi
            arm-linux-androideabi
            i686-linux-android
            x86_64-linux-android
          )

          for triple in "${TRIPLES[@]}"; do
            sudo ln -sf "$TOOLCHAIN/llvm-ar" "/usr/local/bin/${triple}-ar"
            sudo ln -sf "$TOOLCHAIN/llvm-ranlib" "/usr/local/bin/${triple}-ranlib"
          done

      - name: Set Tauri config overrides
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="0.1.${{ github.run_number }}-dev.$SHORT_SHA"

          printf 'TAURI_CONFIG_OVERRIDE=%s\n' \
            "{\"productName\":\"lettuceai-dev\",\"version\":\"$VERSION\"}" \
            >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Android overrides
        run: node scripts/apply-android-overrides.mjs

      - name: Remove release signing requirement for debug build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(f"Gradle file not found: {path}")

          text = path.read_text()

          start_marker = '    signingConfigs {'
          end_marker = '    buildTypes {'

          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)

              text = text[:start] + text[end:]
              print("Removed release signing configuration.")
          else:
              print("No signingConfigs block found; nothing to remove.")

          release_signing_line = '            signingConfig = signingConfigs.getByName("release")\n'

          if release_signing_line in text:
              text = text.replace(release_signing_line, "")
              print("Removed release signingConfig reference.")
          else:
              print("No release signingConfig reference found.")

          path.write_text(text)
          PY

          echo "Final signing-related lines:"
          grep -n -i "signing" src-tauri/gen/android/app/build.gradle.kts || true

      - name: Fetch eSpeak NG Android bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PIN_FILE=".github/espeak-android-bundle.env"

          if [ ! -f "$PIN_FILE" ]; then
            echo "Missing $PIN_FILE — publish a bundle via .github/workflows/espeak-android-bundle.yml first." >&2
            exit 1
          fi

          . "$PIN_FILE"

          if [ -z "${BUNDLE_TAG:-}" ] || \
             [ -z "${BUNDLE_ASSET:-}" ] || \
             [ -z "${BUNDLE_SHA256:-}" ]; then
            echo "Bundle pin is incomplete (BUNDLE_TAG/BUNDLE_ASSET/BUNDLE_SHA256). Update $PIN_FILE." >&2
            exit 1
          fi

          DEST="$RUNNER_TEMP/$BUNDLE_ASSET"

          echo "Downloading $BUNDLE_ASSET from release $BUNDLE_TAG"

          gh release download "$BUNDLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BUNDLE_ASSET" \
            --output "$DEST" \
            --clobber

          ACTUAL="$(sha256sum "$DEST" | awk '{print $1}')"

          if [ "$ACTUAL" != "$BUNDLE_SHA256" ]; then
            echo "Bundle sha256 mismatch. Expected $BUNDLE_SHA256, got $ACTUAL" >&2
            exit 1
          fi

          echo "KOKORO_ESPEAK_ANDROID_BUNDLE_PATH=$DEST" >> "$GITHUB_ENV"

      - name: Build Tauri Android app (Debug build)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LETTUCE_ANDROID_APPLICATION_ID: dev.lettuceai.app
          RUST_BACKTRACE: 1
        run: |
          bun run tauri android build --ci --config "$TAURI_CONFIG_OVERRIDE" --debug --apk

          echo "Disk usage after Android build:"
          df -h

          rm -rf src-tauri/target

          find src-tauri/gen/android/app/build \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name outputs \
            ! -name kotlin \
            -exec rm -rf {} +

          rm -rf src-tauri/gen/android/.gradle/caches/build-cache-* || true

          echo "Disk usage after pruning build intermediates:"
          df -h

      - name: Verify installable debug APK output
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          APK_ROOT="src-tauri/gen/android/app/build/outputs/apk"
          APK_DIR="$APK_ROOT/universal/debug"
          DEBUG_APK="$APK_DIR/app-universal-debug.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            echo "Debug APK not found at $DEBUG_APK"
            find "$APK_ROOT" -type f -name "*.apk" -print || true
            exit 1
          fi

          BUILD_TOOLS="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          "$APKSIGNER" verify --verbose "$DEBUG_APK"

      - name: Package Android artifacts
        run: |
          APK_ROOT="src-tauri/gen/android/app/build/outputs/apk"
          DEBUG_APK="$APK_ROOT/universal/debug/app-universal-debug.apk"

          mkdir -p dist-artifacts

          if [ ! -f "$DEBUG_APK" ]; then
            echo "Debug universal APK not found at $DEBUG_APK"
            exit 1
          fi

          cp "$DEBUG_APK" dist-artifacts/android-universal-debug.apk

          (
            cd "$APK_ROOT"

            find . \
              -type f \
              -name "*.apk" \
              ! -name "*-unsigned.apk" \
              | sort > "$GITHUB_WORKSPACE/dist-artifacts/apk-file-list.txt"

            if [ ! -s "$GITHUB_WORKSPACE/dist-artifacts/apk-file-list.txt" ]; then
              echo "No installable APK files found under $APK_ROOT"
              exit 1
            fi

            zip -9 \
              "$GITHUB_WORKSPACE/dist-artifacts/android-apk-bundle.zip" \
              -@ < "$GITHUB_WORKSPACE/dist-artifacts/apk-file-list.txt"
          )

      - name: Upload Android APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist-artifacts/android-universal-debug.apk
            dist-artifacts/android-apk-bundle.zip
            dist-artifacts/apk-file-list.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          files: |
            dist-artifacts/android-universal-debug.apk
            dist-artifacts/android-apk-bundle.zip
          fail_on_unmatched_files: true

  cleanup_release_on_failure:
    name: Cleanup release on failure/cancel
    needs:
      - prepare_release
      - android

    if: ${{ always() && needs.prepare_release.result == 'success' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}

    runs-on: ubuntu-latest

    steps:
      - name: Delete prerelease and tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;

            if (!tag) {
              core.info("No release tag from prepare_release; skipping cleanup.");
              return;
            }

            const { owner, repo } = context.repo;

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              });

              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.data.id
              });

              core.info(`Deleted release ${tag} (id=${release.data.id}).`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} not found; skipping.`);
              } else {
                throw error;
              }
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`
              });

              core.info(`Deleted tag ${tag}.`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Tag ${tag} not found; skipping.`);
              } else {
                throw error;
              }
            }
